# Publishes the Impeach landing page at impeach/site to GitHub Pages.
#
# Added by the Impeach build. It does not touch any of the upstream CLI
# workflows in this directory.
#
# Why it publishes the committed site rather than building it here: the page is
# hand written, and the sample report it shows needs a real audit, which needs
# the Entire CLI, the entire-graph plugin and a checkpoint, none of which exist
# in this runner. So the site is committed, and this workflow's job is to
# refuse to publish it if it has drifted from the report it shows.
#
# The drift check is the point. The landing page's hero is lifted verbatim from
# the sample report, so the two surfaces cannot disagree about what the tool
# found. If someone hand-edits impeach/site, or changes the report's stylesheet
# without regenerating, those tests fail and nothing is published.

name: impeach pages

on:
  push:
    branches: [main]
    paths:
      # The site itself, and anything the site is generated from, so a change
      # to the report that was not regenerated is caught rather than shipped.
      - 'impeach/site/**'
      - 'impeach/internal/report/**'
      - '.github/workflows/impeach-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. In-progress runs are cancelled, because only the
# newest commit's page is worth publishing.
concurrency:
  group: impeach-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: impeach/go.mod
          # No dependency cache: the module is standard library only, so
          # there is no go.sum and pointing at one only produces a warning
          # about paths that cannot be resolved.
          cache: false

      # Refuse to publish a page that has drifted from the report it claims to
      # show. -count=1 because a cached pass is a claim about code that was
      # not re-run, which is the kind of thing this repository is about.
      - name: Verify the site has not drifted from the report
        working-directory: impeach
        run: go test -count=1 ./internal/report/... -run 'TestSite|TestLandingHero|TestScrubber|TestExtractSection'

      # The whole suite, offline. The recorded scenarios need no Entire, no
      # git and no agent, so there is no reason not to run everything.
      - name: Run the full test suite
        working-directory: impeach
        run: go test -count=1 ./...

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: impeach/site

      - id: deploy
        uses: actions/deploy-pages@v4
